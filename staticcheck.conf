#
# ST1005 is disabled deliberately. This module's error strings open with the
# domain's proper nouns — "Task", "Goal" — which are the exported Go type names
# that the schemas and the public documentation use. Lowercasing them would make
# the runtime's messages disagree with the vocabulary they describe.
checks = ["inherit", "-ST1005"]
