schema_version: 1

repository:
  id: "repo_01KZYGJ35WA3CY3EQ2751775K0"
  display_name: "agent-runtime"
  roles:
    - "project"
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 1332584050
  owner: "NDDev-it-com"
  name: "agent-runtime"

classification:
  portfolios:
    - "portfolio:organization-projects"
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "organization-default"
    - "public-module"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    lint:
      # staticcheck is pinned in security-tools.json and its pin is verified by
      # check-ci-contract, so the version here is not a preference. It runs on
      # the compatibility toolchain, in the same CI job as go vet.
      - "go vet ./..."
      - "go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./..."
      - "go run ./cmd/check-module-tidy"
    test:
      - "go test -race ./..."
      - "go run ./cmd/check-fuzz"
    build:
      - "go build ./cmd/agent-runtime"
      - "go run ./cmd/check-cold-compile"
    compatibility:
      # This repository proves its CI, governance and release contracts with
      # executable checkers rather than prose; each is a required CI step.
      - "go run ./cmd/check-ci-contract"
      - "go run ./cmd/check-governance-contract"
      - "go run ./cmd/check-release-contract"
      # The Goal journal is this module's own product, and its tracked
      # instances are held to the same contract a consumer would apply.
      - "go run ./cmd/check-goal-journals"
    full:
      # govulncheck resolves the live vulnerability database and needs the
      # patched security toolchain, not the compatibility one, so CI runs it in
      # its own lane. It is recorded here rather than under lint because it
      # cannot execute under the Go version the other lanes pin.
      - "go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."
  required:
    - "lint"
    - "test"
    - "build"
    - "compatibility"
  # The status checks the protected branch actually requires. This is a
  # separate list from commands on purpose: a required context is a check-run
  # name, not something derivable from a command, and stating it is what lets
  # the consuming control plane compare the two. Drift is then reported in both
  # directions — a branch check this list omits, or a claim the branch does not
  # enforce. Governance holds the same four in governance/main-v1alpha1.json.
  required_contexts:
    - "test (ubuntu-latest)"
    - "test (macos-latest)"
    - "govulncheck"
    - "Analyze (go)"

agent:
  context_profile: "public-module"
  generated_agents: false
  serena:
    enabled: false
    provenance_required: false

module:
  contract: "public"
  consumption:
    # Pinned as a gitlink by the control plane. Not vendored, not published to
    # a package registry, and not executed from its own repository.
    - "git-submodule"
  # The module publishes semver releases with attested assets, and the control
  # plane pins by release tag. Both halves are stated because they are separate
  # axes: the first is what this repository promises a consumer, the second is
  # how this estate chooses to take it. The earlier reading — no semver tag, so
  # the contract is the pinned commit — stopped being true at v0.1.2.
  compatibility: "semver"
  pin_policy: "version-tag"
  publication:
    registry: "none"
    github_release: "required"

release:
  mode: "github-release"
