schema_version: 1

repository:
  id: "repo_01KZYGJ35WA3CY3EQ2751775K0"
  display_name: "agent-runtime"
  roles:
    - "project"
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 1332584050
  owner: "NDDev-it-com"
  name: "agent-runtime"

classification:
  portfolios:
    - "portfolio:organization-projects"
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "organization-default"
    - "public-module"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    lint:
      - "go vet ./..."
      - "go run ./cmd/check-module-tidy"
    test:
      - "go test -race ./..."
      - "go run ./cmd/check-fuzz"
    build:
      - "go build ./cmd/agent-runtime"
      - "go run ./cmd/check-cold-compile"
    compatibility:
      # This repository proves its CI, governance and release contracts with
      # executable checkers rather than prose; each is a required CI step.
      - "go run ./cmd/check-ci-contract"
      - "go run ./cmd/check-governance-contract"
      - "go run ./cmd/check-release-contract"
  required:
    - "lint"
    - "test"
    - "build"
    - "compatibility"

agent:
  context_profile: "public-module"
  generated_agents: false
  serena:
    enabled: false
    provenance_required: false

module:
  contract: "public"
  consumption:
    # Pinned as a gitlink by the control plane. Not vendored, not published to
    # a package registry, and not executed from its own repository.
    - "git-submodule"
  # The published surface is `v1alpha1` and carries no semver tag, so the
  # consumer contract is the exact pinned commit until a tagged line exists.
  compatibility: "commit-contract"
  pin_policy: "default-branch-commit"
  publication:
    registry: "none"
    github_release: "required"

release:
  mode: "github-release"
