# SPDX-License-Identifier: AGPL-3.0-only

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/agent-runtime
      - run: go run ./cmd/check-ci-contract
      - run: go run ./cmd/check-governance-contract

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Record security toolchain
        run: |
          {
            echo "### Security toolchain"
            echo
            echo "- Go: \`$(go version)\`"
            echo "- Scanner: \`golang.org/x/vuln/cmd/govulncheck@v1.6.0\`"
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -version
          } >>"${GITHUB_STEP_SUMMARY}"
      - run: go run ./cmd/check-ci-contract
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
