name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Run every contracted fuzz target independently
        run: go run ./cmd/check-fuzz
      - run: go build ./cmd/agent-runtime
      - name: Cold-compile every supported platform variant
        run: go run ./cmd/check-cold-compile
      - name: Verify typed exact source or integration provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            go run ./cmd/check-signature --commit "$EXPECTED_COMMIT"
          else
            go run ./cmd/check-provenance --integration "$EXPECTED_COMMIT"
          fi
      - name: Verify module metadata is tidy without mutation
        run: go run ./cmd/check-module-tidy
      - run: go run ./cmd/check-ci-contract
      - run: go run ./cmd/check-governance-contract
      - name: Reproduce release bundle without publication
        run: |
          set -euo pipefail
          parent="$(mktemp -d)"
          first="$parent/first"
          second="$parent/second"
          first_result="$parent/first-result.json"
          second_result="$parent/second-result.json"
          trap 'rm -rf -- "$parent"' EXIT
          go run ./cmd/check-release-contract --build --commit HEAD --out "$first" --result "$first_result"
          go run ./cmd/check-release-contract --build --commit HEAD --out "$second" --result "$second_result"
          go run ./cmd/check-release-contract --out "$first" --verify-result "$first_result"
          go run ./cmd/check-release-contract --out "$second" --verify-result "$second_result"
          diff -rq "$first" "$second"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Record security toolchain
        run: |
          {
            echo "### Security toolchain"
            echo
            echo "- Go: \`$(go version)\`"
            echo "- Scanner: \`golang.org/x/vuln/cmd/govulncheck@v1.6.0\`"
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -version
          } >>"${GITHUB_STEP_SUMMARY}"
      - run: go run ./cmd/check-ci-contract
      - run: go run ./cmd/check-release-contract
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/agent-runtime
      - run: go run ./cmd/check-module-tidy
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
