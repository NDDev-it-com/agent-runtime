# SPDX-License-Identifier: AGPL-3.0-only

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  RELEASE_CONTRACT: release/v1alpha1.json

jobs:
  release:
    name: Build, attest, and publish source release
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the compatible Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify immutable signed exact-main release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
          go run ./cmd/check-release-contract --expect-version "$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          tag_object="$(git rev-parse "$RELEASE_TAG^{tag}")"
          go run ./cmd/check-signature --tag "$tag_object" --expected-commit "$tag_commit"
          go run ./cmd/check-provenance --integration "$tag_commit"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$tag_commit" = "$(git rev-parse refs/remotes/origin/main)"
          remote_tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$remote_tag_object" = "$(git rev-parse "$RELEASE_TAG")"
          tag_verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_tag_object}" --jq '.verification.verified')"
          test "$tag_verification" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')" = true
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists; immutable releases are append-only" >&2
            exit 1
          fi
      - name: Cold-compile every supported platform variant
        run: go run ./cmd/check-cold-compile
      - name: Validate contract and build deterministic bundle
        run: |
          set -euo pipefail
          release_parent="$(mktemp -d "${RUNNER_TEMP}/agent-runtime-release.XXXXXX")"
          release_dist="${release_parent}/release-dist"
          release_result="${release_parent}/build-result.json"
          go run ./cmd/check-release-contract --contract "$RELEASE_CONTRACT" --expect-version "$GITHUB_REF_NAME" --build --commit HEAD --out "$release_dist" --result "$release_result"
          go run ./cmd/check-release-contract --contract "$RELEASE_CONTRACT" --out "$release_dist" --verify-result "$release_result"
          echo "RELEASE_DIST=$release_dist" >>"$GITHUB_ENV"
          {
            echo '### Release bundle'
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Go: \`$(go version)\`"
            echo '- Assets:'
            sed 's/^/  - `/' "$release_dist/SHA256SUMS" | sed 's/$/`/'
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Attest every material release asset
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.RELEASE_DIST }}/*
      - name: Bind SPDX SBOM to source archive
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ env.RELEASE_DIST }}/agent-runtime-${{ github.ref_name }}-source.tar.gz
          sbom-path: ${{ env.RELEASE_DIST }}/agent-runtime-${{ github.ref_name }}.spdx.json
      - name: Reconcile identity and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$tag_commit" = "$(git rev-parse refs/remotes/origin/main)"
          remote_tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$remote_tag_object" = "$(git rev-parse "$RELEASE_TAG")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release appeared during build; refusing mutation" >&2
            exit 1
          fi
          dist="$RELEASE_DIST"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$dist/release-notes-${RELEASE_TAG}.md" \
            "$dist/agent-runtime-${RELEASE_TAG}-source.tar.gz" \
            "$dist/agent-runtime-${RELEASE_TAG}.spdx.json" \
            "$dist/release-notes-${RELEASE_TAG}.md" \
            "$dist/release-manifest-${RELEASE_TAG}.json" \
            "$dist/SHA256SUMS"
